function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1+Math.floor(days/31) : 7+Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return {jy, jm, jd};
}

function getTodayJalali() {
  const now = new Date();
  const j = toJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  return String(j.jy) + '/' + String(j.jm).padStart(2,'0') + '/' + String(j.jd).padStart(2,'0');
}

configs.forEach((config, index) => {

  const name = config.includes('#') ? decodeURIComponent(config.split('#')[1]) : ('کانفیگ ' + (index + 1));
  div.innerHTML = `
    <div class="config-header">
      <input type="checkbox" id="check-${index}" onchange="toggleItem(${index})">
      <span class="name">${name}</span>
      <span class="small-date">${todayDate}</span>
    </div>
    <div class="config-text">${config}</div>
    <button class="copy-btn" onclick="copyOne(${index}, this)">📋 کپی این کانفیگ</button>
  `;
  list.appendChild(div);

function toggleItem(index) {
  const item = document.getElementById('item-' + index);
  const check = document.getElementById('check-' + index);
  if (check.checked) item.classList.add('selected');
  else item.classList.remove('selected');
}

function selectAll() {
  configs.forEach((_, i) => {
    document.getElementById('check-' + i).checked = true;
    toggleItem(i);
  });
}

function deselectAll() {
  configs.forEach((_, i) => {
    document.getElementById('check-' + i).checked = false;
    toggleItem(i);
  });
}

function copyOne(index, btn) { copyText(configs[index], btn); }

function copySelected() {
  const selected = [];
  configs.forEach((c, i) => {
    if (document.getElementById('check-' + i).checked) selected.push(c);
  });
  if (selected.length === 0) { showToast('⚠️ هیچ کانفیگی انتخاب نشده!'); return; }
  copyText(selected.join('\n\n'), null);
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    if (btn) {
      const original = btn.textContent;
      btn.textContent = '✅ کپی شد!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 2000);
    }
    showToast('✅ کپی شد!');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    if (btn) {
      const original = btn.textContent;
      btn.textContent = '✅ کپی شد!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 2000);
    }
    showToast('✅ کپی شد!');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}
